<title>Nations Clothing · Admin</title>

<style>
:root{--ink:#1d1410;--mid:#76655b;--dim:#a8988d;--line:#eadfd6;--bg:#f7f1ec;--card:#fff;--brown:#6b3a1f;--dark:#3b2116;--ok:#2f6b3a;--warn:#a8321f;--soft:#f3e3d6;
  --f:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font:400 15px/1.5 var(--f);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--brown)}button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brown);outline-offset:2px}
.hide{display:none!important}
.logo svg{height:44px;width:auto;display:block}
.logo .lg-c,.logo .lg-w,.logo .lg-t,.logo .lg-e{fill:#fff}

/* sign in */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--dark)}
.gate .box{background:#fff;width:100%;max-width:400px;padding:32px 28px;display:grid;gap:16px}
.gate .logo{background:var(--dark);margin:-32px -28px 8px;padding:26px 28px;display:flex;justify-content:center}.gate .logo svg{height:84px}
.gate h1{font-size:20px;font-weight:600}
.gate p{color:var(--mid);font-size:14px}
.gate h1{margin-top:4px}
#gbody{display:grid;gap:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);background:#faf6f2;padding:3px}
.seg button{border:0;background:none;padding:10px;font-size:14px;color:var(--mid)}
.seg button[aria-selected=true]{background:#fff;color:var(--brown);font-weight:600;box-shadow:0 1px 3px rgba(59,33,22,.12)}
input.code{font-size:24px;letter-spacing:.32em;text-align:center;font-variant-numeric:tabular-nums;padding:12px}
.linkb{border:0;background:none;color:var(--brown);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.gate .box>h1,.gate .box>p{margin:0}.gate .box>.btn{justify-self:start}
.sheet.center{justify-content:center;align-items:center;padding:16px}.sheet .pane.small{height:auto;width:min(440px,100%)}
.tick{width:56px;height:56px;border-radius:50%;background:var(--brown);color:#fff;display:grid;place-items:center;font-size:26px}

/* shell */
.top{position:sticky;top:0;z-index:20;background:var(--dark);color:#fff;display:flex;align-items:center;gap:16px;padding:10px 20px}
.top .who{margin-left:auto;font-size:13px;color:#e4d3c6;text-align:right;line-height:1.3}
.top .who a{color:#fff}
.nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:64px;z-index:19;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;padding:14px 12px;font-size:14px;color:var(--mid);white-space:nowrap;border-bottom:2px solid transparent}
.nav button[aria-current=page]{color:var(--brown);border-color:var(--brown);font-weight:600}
.nav .dot{display:inline-block;min-width:18px;padding:0 5px;margin-left:6px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center}
main{max-width:1100px;margin:0 auto;padding:24px 16px 80px}
h2{font-size:22px;font-weight:600;margin-bottom:4px}
.sub{color:var(--mid);font-size:14px;margin-bottom:20px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);padding:18px}
.grid{display:grid;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:24px}
.stat{background:#fff;border:1px solid var(--line);padding:16px}
.stat b{display:block;font-size:26px;font-weight:600;color:var(--brown);font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:13px;color:var(--mid)}
h3{font-size:16px;font-weight:600;margin:24px 0 10px}

/* controls */
.btn{border:1px solid var(--brown);background:var(--brown);color:#fff;padding:10px 16px;font-size:14px;font-weight:500;border-radius:0;display:inline-flex;gap:6px;align-items:center;justify-content:center;text-decoration:none;min-height:42px}
.btn.ghost{background:#fff;color:var(--brown)}
.btn.small{padding:6px 10px;min-height:34px;font-size:13px}
.btn.danger{background:#fff;color:var(--warn);border-color:#e3c2bb}
.btn.wa{background:#1f7a46;border-color:#1f7a46}
.btn[disabled]{opacity:.45;pointer-events:none}
label.f{display:grid;gap:5px;font-size:13px;color:var(--mid)}
label.f i{font-style:normal;color:var(--dim)}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=tel],select,textarea{width:100%;border:1px solid #dccdc1;background:#fff;padding:10px 12px;font-size:16px;border-radius:0;color:var(--ink)}
textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.two{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.chk{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);padding:8px 12px;background:#fff;font-size:14px;cursor:pointer}
.chk input{accent-color:var(--brown);width:17px;height:17px}
.hint{font-size:12.5px;color:var(--mid)}
.err{color:var(--warn);font-size:14px}.err:empty{display:none}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;font-size:14px;z-index:99;max-width:calc(100vw - 32px);box-shadow:0 8px 30px rgba(0,0,0,.2)}
.empty{padding:40px 16px;text-align:center;color:var(--mid);background:#fff;border:1px dashed var(--line)}

/* lists */
.list{display:grid;gap:8px}
.item{background:#fff;border:1px solid var(--line);display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px}
.item img,.thumb{width:64px;height:80px;object-fit:cover;background:var(--soft)}
.item h4{font-size:15px;font-weight:600;line-height:1.3}
.item .meta{font-size:13px;color:var(--mid)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:2px 7px;background:var(--soft);color:var(--brown);border-radius:9px;white-space:nowrap}
.tag.off{background:#f1ece8;color:var(--dim)}.tag.red{background:#f8e1dc;color:var(--warn)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:620px){.item{grid-template-columns:56px minmax(0,1fr)}.item img{width:56px;height:70px}.item .acts{grid-column:1/-1;justify-content:flex-start}}

/* orders */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:#fff;padding:7px 12px;font-size:13px;border-radius:18px;color:var(--mid)}
.filters button[aria-pressed=true]{background:var(--brown);border-color:var(--brown);color:#fff}
.order{background:#fff;border:1px solid var(--line)}
.order>summary{list-style:none;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer}
.order>summary::-webkit-details-marker{display:none}
.order[open]>summary{border-bottom:1px solid var(--line)}
.ono{font-weight:600;font-variant-numeric:tabular-nums}
.st{font-size:11.5px;padding:3px 9px;border-radius:10px;font-weight:600;text-transform:capitalize;white-space:nowrap}
.st.new{background:#fde7c8;color:#8a4b00}.st.confirmed{background:#e3ecfb;color:#24508f}.st.paid{background:#dff0e2;color:#2f6b3a}
.st.shipped{background:#ece3f6;color:#5b3a86}.st.delivered{background:#e1efe9;color:#1f5b45}.st.cancelled{background:#f1ece8;color:#8b7d74}
.obody{padding:14px;display:grid;gap:14px}
.lines{display:grid;gap:8px}
.line{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.line img{width:44px;height:55px;object-fit:cover;background:var(--soft)}
.money{font-variant-numeric:tabular-nums;font-weight:600}
dl.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:4px 10px;font-size:14px}
dl.kv dt{color:var(--mid)}dl.kv dd{overflow-wrap:anywhere}
table.t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px}
.t th,.t td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.t th{font-size:12px;color:var(--mid);font-weight:600;background:#fbf7f3}
.t td.n,.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

/* editor */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(29,20,16,.5);display:flex;justify-content:flex-end}
.sheet .pane{background:var(--bg);width:min(680px,100%);height:100%;overflow:auto;display:flex;flex-direction:column}
.sheet .ph{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:center;gap:10px;z-index:2}
.sheet .ph h3{margin:0;flex:1}
.sheet .pb{padding:18px;display:grid;gap:16px}
.sheet .pf{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:10px;margin-top:auto}
.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.pic{background:#fff;border:1px solid var(--line);padding:8px;display:grid;gap:6px;font-size:13px}
.pic .im{aspect-ratio:4/5;background:var(--soft) center/contain no-repeat;display:grid;place-items:center;color:var(--dim);font-size:12px;text-align:center;padding:6px}
.pic .im.cut{background-color:#fff;background-image:linear-gradient(45deg,#f1e9e3 25%,transparent 25%,transparent 75%,#f1e9e3 75%),linear-gradient(45deg,#f1e9e3 25%,transparent 25%,transparent 75%,#f1e9e3 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.pic .im img{width:100%;height:100%;object-fit:contain}
.pic b{font-weight:600}
.pic .acts{justify-content:flex-start}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
.lbg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.lbg .pic .im{aspect-ratio:3/4;background-size:cover}
.policyrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;background:#fff;border:1px solid var(--line);padding:10px}
.policyrow .grid{gap:8px}
</style>

async function sendCode(mode,email,name){

async function rest(path,{method='GET',body,prefer}={}){
  const s=await sess();if(!s){expired();return {ok:false,error:'Your session has expired. Sign in again.'}}
  try{const h=hdr(s.access_token,{'Content-Type':'application/json'});if(prefer)h.Prefer=prefer;
    const r=await fetch(SB+'/rest/v1/'+path,{method,headers:h,body:body?JSON.stringify(body):undefined});
    if(r.status===401){expired();return {ok:false,error:'Your session has expired.'}}
    const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch(e){}
    return r.ok?{ok:true,data:d}:{ok:false,error:friendly(d)}}
  catch(e){return {ok:false,error:'Could not reach the server. Check your connection.'}}
}
function friendly(d){const m=(d&&(d.message||d.msg))||'';
  if(/duplicate key/.test(m))return 'Something with that name already exists. Choose another.';
  if(/violates check constraint/.test(m))return 'One of the values is not allowed. Check the fields and try again.';
  return m||'Saving did not work. Try again.'}
const db={
  get:(t,q)=>rest(t+'?'+q),
  add:(t,row)=>rest(t,{method:'POST',body:row,prefer:'return=representation'}),
  set:(t,id,p,col='id')=>rest(t+'?'+col+'=eq.'+encodeURIComponent(id),{method:'PATCH',body:p,prefer:'return=representation'}),
  rpc:(f,a)=>rest('rpc/'+f,{method:'POST',body:a||{}})
};
async function upload(path,blob){const s=await sess();if(!s){expired();return {ok:false,error:'Your session has expired.'}}
  try{const r=await fetch(SB+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:hdr(s.access_token,{'Content-Type':blob.type,'Cache-Control':'31536000','x-upsert':'false'}),body:blob});
    if(r.ok)return {ok:true};const d=await r.json().catch(()=>({}));return {ok:false,error:d.message||'Upload failed ('+r.status+').'}}
  catch(e){return {ok:false,error:'The upload was interrupted. Check your connection and try again.'}}}
async function removeFiles(paths){if(!paths.length)return;const s=await sess();if(!s)return;
  try{await fetch(SB+'/storage/v1/object/'+BUCKET,{method:'DELETE',headers:hdr(s.access_token,{'Content-Type':'application/json'}),body:JSON.stringify({prefixes:paths})})}catch(e){}}

/* ---------- pictures: resized in the browser before upload ---------- */
async function decode(file){
  if('createImageBitmap' in window){try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}}
  const u=URL.createObjectURL(file);try{const i=new Image();i.src=u;await i.decode();return i}finally{URL.revokeObjectURL(u)}}
function draw(src,w,h,tw,th,type,q){const k=Math.min(1,tw?tw/w:th/h);const c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);
  return new Promise((res,rej)=>c.toBlob(b=>b?res({b,w:c.width,h:c.height}):rej(new Error('Could not process this picture.')),type,q))}
const rnd=()=>Math.random().toString(36).slice(2,10);
/* kind 'photo': JPEG 800 + 1600 wide.  kind 'cut': transparent runway picture, WebP (PNG where WebP is not available) 1000 + 1300 tall. */
async function sendPicture(file,folder,kind='photo'){
  if(!/^image\//.test(file.type))throw new Error(file.name+' is not a picture.');
  if(file.size>40*1024*1024)throw new Error(file.name+' is larger than 40 MB.');
  let s;try{s=await decode(file)}catch(e){throw new Error(file.name+' could not be opened. Save it as a JPEG or PNG and try again.')}
  const w=s.width||s.naturalWidth,h=s.height||s.naturalHeight;
  if(w<400||h<400)throw new Error(file.name+' is too small (at least 400 × 400 pixels).');
  let big,small,ext;
  if(kind==='cut'){big=await draw(s,w,h,0,1300,'image/webp',.86);ext='webp';
    if(big.b.type!=='image/webp'){big=await draw(s,w,h,0,1300,'image/png');ext='png'}
    small=await draw(s,w,h,0,1000,ext==='webp'?'image/webp':'image/png',.84)}
  else{big=await draw(s,w,h,1600,0,'image/jpeg',.84);small=await draw(s,w,h,800,0,'image/jpeg',.84);ext='jpg'}
  s.close&&s.close();
  const base=folder+'/'+Date.now().toString(36)+'-'+rnd();
  for(const [b,sz] of [[big,'1600'],[small,'800']]){const r=await upload(base+'-'+sz+'.'+ext,b.b);if(!r.ok)throw new Error(r.error)}
  return {ref:'sb:'+base+'-1600.'+ext,w:big.w,h:big.h};
}
const filesOf=r=>r&&r.startsWith('sb:')?[r.slice(3),r.slice(3).replace('-1600.','-800.')]:[];

function csv(name,rows){const t=rows.map(r=>r.map(v=>{v=String(v==null?'':v);if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+t],{type:'text/csv'}));a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}

     <div class="acts">${PF==='all'?`<button class="btn small ghost" data-up="${x.id}" ${i?'':'disabled'} aria-label="Move up">↑</button><button class="btn small ghost" data-dn="${x.id}" ${i<L.length-1?'':'disabled'} aria-label="Move down">↓</button>`:''}<button class="btn small" data-ed="${x.id}">Edit</button></div></div>`).join(''):'<div class="empty">Nothing here.</div>'};

async function renumber(L,table){const ch=[];L.forEach((x,k)=>{if(x.sort!==k*10){x.sort=k*10;ch.push(x)}});
  const r=await Promise.all(ch.map(x=>db.set(table,x.id,{sort:x.sort,updated_at:new Date().toISOString()})));toast(r.every(x=>x.ok)?'Order saved':'Some changes did not save. Reload and try again.')}

const slug=s=>s.toLowerCase().replace(/^the\s+/,'').normalize('NFKD').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,36)||'piece';
const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
function sheet(title,body,foot){const d=document.createElement('div');d.className='sheet';d.innerHTML=`<div class="pane" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="ph"><h3>${esc(title)}</h3><button class="btn small ghost" data-x>Close</button></div><div class="pb">${body}</div><div class="pf">${foot}</div></div>`;
  document.body.append(d);document.body.style.overflow='hidden';const close=()=>{d.remove();document.body.style.overflow=''};
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-x]'))close()});d.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  setTimeout(()=>{const f=d.querySelector('input,textarea');f&&f.focus()},50);return {d,close}}
function editProduct(x){
  const isNew=!x;x=x||{name:'',grp:'women',price:null,big_price:null,sizes:[],colours:[],description:'',perfect_for:'',note:'',photo:'',photo2:null,new_photo:null,cutout:null,cutout_w:null,cutout_h:null,scale:1,in_catalogue:true,in_women:false,is_new:true,on_runway:false,sold_out:false};
  const P={photo:x.photo,photo2:x.photo2,new_photo:x.new_photo,cutout:x.cutout,cutout_w:x.cutout_w,cutout_h:x.cutout_h},added=[];
  const slot=(k,t,h,cut)=>`<div class="pic" data-slot="${k}"><div class="im ${cut?'cut':''}">${P[k]?`<img src="${esc(pic(P[k]))}" alt="">`:'No picture'}</div><b>${t}</b><span class="hint">${h}</span><div class="acts"><label class="btn small ghost file">${P[k]?'Replace':'Upload'}<input type="file" accept="image/*" data-up="${k}"></label>${P[k]&&k!=='photo'?`<button class="btn small danger" data-clr="${k}">Remove</button>`:''}</div></div>`;
  const pics=()=>slot('photo','Main photo','Catalogue and product page. Required.')+slot('photo2','Second photo','Shown when someone opens the piece.')+slot('new_photo','New arrivals photo','Wide photo for the New Arrivals band. Uses the main photo if empty.')+slot('cutout','Runway picture','A PNG with a see-through background, the model from head to toe.',1);
  const {d,close}=sheet(isNew?'Add a product':'Edit '+x.name,`
   <label class="f">Name<input type="text" id="p-name" maxlength="80" value="${esc(x.name)}" placeholder="The Esther Dress"></label>
   <div class="two"><label class="f">For<select id="p-grp"><option value="women" ${x.grp==='women'?'selected':''}>Women (uses the women's size check)</option><option value="men" ${x.grp==='men'?'selected':''}>Men (uses the men's size check)</option></select></label>
   <label class="f">Price in naira <i>(leave empty for “price on request”)</i><input type="number" id="p-price" min="0" step="500" inputmode="numeric" value="${x.price==null?'':x.price}"></label></div>
   <div class="two"><label class="f">Price for size 20 and above <i>(optional)</i><input type="number" id="p-big" min="0" step="500" inputmode="numeric" value="${x.big_price==null?'':x.big_price}"></label>
   <label class="f">Sizes <i>(separate with commas)</i><input type="text" id="p-sizes" value="${esc(x.sizes.join(', '))}" placeholder="4, 6, 8, 10, 12 or S, M, L, XL"></label></div>
   <label class="f">Colours <i>(separate with commas)</i><input type="text" id="p-cols" value="${esc(x.colours.join(', '))}" placeholder="Wine, Black, Brown"></label>
   <label class="f">Description<textarea id="p-desc" maxlength="1200" rows="3">${esc(x.description)}</textarea></label>
   <div class="two"><label class="f">Perfect for <i>(optional)</i><input type="text" id="p-for" maxlength="200" value="${esc(x.perfect_for)}" placeholder="Weddings, birthdays, church"></label>
   <label class="f">Short note <i>(optional)</i><input type="text" id="p-note" maxlength="200" value="${esc(x.note)}" placeholder="Processed within 3 to 7 working days."></label></div>
   <div><div class="f" style="font-size:13px;color:var(--mid);margin-bottom:6px">Where it shows</div><div class="checks">
    <label class="chk"><input type="checkbox" id="p-cat" ${x.in_catalogue?'checked':''}> Catalogue</label>
    <label class="chk"><input type="checkbox" id="p-wom" ${x.in_women?'checked':''}> Women section</label>
    <label class="chk"><input type="checkbox" id="p-new" ${x.is_new?'checked':''}> New arrivals</label>
    <label class="chk"><input type="checkbox" id="p-run" ${x.on_runway?'checked':''}> Runway (needs a runway picture)</label>
    <label class="chk"><input type="checkbox" id="p-sold" ${x.sold_out?'checked':''}> Sold out</label></div></div>
   <div><div style="font-size:13px;color:var(--mid);margin-bottom:6px">Pictures <span class="hint">· Big phone photos are made smaller automatically before upload.</span></div><div class="pics" id="pics">${pics()}</div></div>
   <label class="f">Runway size <i>(make a model a little smaller if they look too tall next to the others)</i><select id="p-scale">${[1.1,1,.95,.9,.85,.8].map(v=>`<option value="${v}" ${Math.abs(v-x.scale)<.01?'selected':''}>${Math.round(v*100)}%</option>`).join('')}</select></label>
   <div class="err" id="perr" role="alert"></div>`,
   `<button class="btn" id="psave">${isNew?'Add product':'Save changes'}</button><button class="btn ghost" data-x>Cancel</button><span class="sp"></span>${isNew?'':'<button class="btn danger" id="pdel">Delete</button>'}`);
  const err=t=>{d.querySelector('#perr').textContent=t;if(t)d.querySelector('#perr').scrollIntoView({block:'nearest'})};
  d.querySelector('#pics').addEventListener('change',async e=>{const k=e.target.dataset.up;if(!k||!e.target.files[0])return;const card=e.target.closest('.pic');
    card.querySelector('.im').innerHTML='Uploading…';err('');
    try{const u=await sendPicture(e.target.files[0],'products',k==='cutout'?'cut':'photo');P[k]=u.ref;added.push(u.ref);if(k==='cutout'){P.cutout_w=u.w;P.cutout_h=u.h}}
    catch(ex){err(ex.message)}
    d.querySelector('#pics').innerHTML=pics()});
  d.querySelector('#pics').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.clr;if(!k)return;P[k]=null;if(k==='cutout'){P.cutout_w=P.cutout_h=null}d.querySelector('#pics').innerHTML=pics()});
  const v=id=>d.querySelector(id).value.trim(),c=id=>d.querySelector(id).checked;

    const row={name,grp:v('#p-grp'),price:price===''?null:Math.round(+price),big_price:big===''?null:Math.round(+big),sizes,colours:cols,description:v('#p-desc'),perfect_for:v('#p-for'),note:v('#p-note'),
      photo:P.photo,photo2:P.photo2,new_photo:P.new_photo,cutout:P.cutout,cutout_w:P.cutout_w,cutout_h:P.cutout_h,scale:+v('#p-scale'),
      in_catalogue:c('#p-cat'),in_women:c('#p-wom'),is_new:c('#p-new'),on_runway:c('#p-run'),sold_out:c('#p-sold')};
    const b=d.querySelector('#psave');b.disabled=true;let r;
    if(isNew){let id=slug(name),n=2;const ids=new Set((CACHE.products||[]).map(p=>p.id));
      const all=await db.get('products','select=id');(all.data||[]).forEach(p=>ids.add(p.id));while(ids.has(id))id=slug(name)+'-'+n++;
      const top=Math.min(0,...(CACHE.products||[]).map(p=>p.sort))-10;
      r=await db.add('products',{...row,id,sort:top})}
    else r=await db.set('products',x.id,{...row,updated_at:new Date().toISOString()});
    b.disabled=false;if(!r.ok)return err(r.error);
    if(!isNew)removeFiles(['photo','photo2','new_photo','cutout'].filter(k=>x[k]&&x[k]!==P[k]).flatMap(k=>filesOf(x[k])));
    added.length=0;close();toast(isNew?'Product added. It is live on the site.':'Saved. The site shows the change now.');if(VIEW==='products')R.products()};
  const pd=d.querySelector('#pdel');if(pd)pd.onclick=async()=>{if(!confirm('Delete '+x.name+'? It is taken off the site and kept in Recently deleted for 30 days.'))return;
    const r=await db.set('products',x.id,{deleted_at:new Date().toISOString()});if(!r.ok)return err(r.error);close();toast('Moved to Recently deleted');R.products()};
  /* pictures uploaded but never saved are tidied away when the editor closes */
  new MutationObserver((m,o)=>{if(!d.isConnected){o.disconnect();if(added.length)removeFiles(added.flatMap(filesOf))}}).observe(document.body,{childList:true});
}

  document.querySelectorAll('form[data-k]').forEach(f=>f.onsubmit=async e=>{e.preventDefault();const k=f.dataset.k,g=n=>(f.elements[n].value||'').trim();let val;
    if(k==='contact'){const w=digits(g('whatsapp'));if(w.length<10)return toast('Enter the WhatsApp number with the country code, e.g. 2348147061094.');val={whatsapp:w,whatsapp_display:g('whatsapp_display')||'+'+w,instagram:g('instagram').replace(/^@/,'').replace(/^https?:\/\/(www\.)?instagram\.com\//,'').replace(/\/.*$/,'')}}
    else if(k==='footer')val={tagline:g('tagline'),lines:g('lines').split('\n').map(s=>s.trim()).filter(Boolean),copyright:g('copyright')};
    else if(k==='policy'){val={items:[...f.querySelectorAll('.policyrow')].map(r=>[r.querySelector('[data-pt]').value.trim(),r.querySelector('[data-pd]').value.trim()]).filter(x=>x[0]||x[1]),thanks:g('thanks')};if(!val.items.length)return toast('Keep at least one point in the policy.')}
    else val={heading:g('heading'),text:g('text')};
    const b=f.querySelector('button:not([type])');b.disabled=true;const r=await db.set('site_text',k,{value:val,updated_at:new Date().toISOString(),updated_by:ME.user_id},'key');b.disabled=false;
    toast(r.ok?'Saved. The site shows the change now.':r.error)});
};

/* ---------- team ---------- */
R.team=async()=>{
  const owner=ME.role==='owner';
  const [u,q]=await Promise.all([db.get('admin_users','select=*&order=created_at'),owner?db.get('admin_requests','select=*&order=created_at.desc'):Promise.resolve({ok:true,data:[]})]);
  if(!u.ok)return fail(u.error);
  reqDot(q.data||[]);
  main(`<h2>Team</h2><p class="sub">Anyone on the team signs in at this page with their email and a code. New people tap <b>Create account</b> here, then ${owner?'you approve them below':'an owner approves them'}.</p>
   ${owner?`<h3>Waiting for approval</h3><div class="list">${q.data&&q.data.length?q.data.map(v=>`<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div><h4>${esc(v.name||v.email)}</h4><div class="meta">${esc(v.email)} · asked ${when(v.created_at)}</div></div>
    <div class="acts"><select data-as="${v.user_id}" aria-label="Role for ${esc(v.name||v.email)}" style="width:auto;padding:6px 8px;font-size:14px"><option value="editor">Editor</option><option value="owner">Owner</option></select><button class="btn small" data-ok="${v.user_id}">Approve</button><button class="btn small danger" data-no="${v.user_id}">Decline</button></div></div>`).join(''):'<div class="empty">Nobody is waiting. When someone creates an account, they show up here.</div>'}</div><h3>Team</h3>`:''}
   <div class="list">${u.data.map(m=>`<div class="item" style="grid-template-columns:minmax(0,1fr) auto"><div><h4>${esc(m.name||m.email)}${m.user_id===ME.user_id?' <span class="hint">(you)</span>':''}</h4><div class="meta">${esc(m.email)} · ${m.role==='owner'?'Owner':'Editor'}</div></div>
    <div class="acts">${owner&&m.user_id!==ME.user_id?`<button class="btn small ghost" data-role="${m.user_id}" data-to="${m.role==='owner'?'editor':'owner'}">Make ${m.role==='owner'?'editor':'owner'}</button><button class="btn small danger" data-rm="${m.user_id}">Remove</button>`:''}</div></div>`).join('')}</div>
   <p class="hint" style="margin-top:14px">Editors can do everything except manage the team. Owners can also approve, remove and change roles.</p>`);
  $('#main').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.ok){b.disabled=true;const role=$(`[data-as="${b.dataset.ok}"]`).value;const r=await db.rpc('admin_approve',{p_user:b.dataset.ok,p_role:role});
      if(!r.ok){b.disabled=false;return toast(r.error)}
      const s=await sess();fetch(SB+'/functions/v1/admin-code',{method:'POST',headers:hdr(s&&s.access_token,{'Content-Type':'application/json'}),body:JSON.stringify({action:'welcome',user_id:b.dataset.ok})}).catch(()=>{});
      toast('Approved. We emailed them a welcome.');R.team()}
    else if(b.dataset.no){if(!confirm('Decline this request? Their account is removed.'))return;const r=await db.rpc('admin_decline',{p_user:b.dataset.no});toast(r.ok?'Request declined':r.error);if(r.ok)R.team()}
    else if(b.dataset.role){const r=await db.rpc('admin_set_role',{p_user:b.dataset.role,p_role:b.dataset.to});toast(r.ok?'Role changed':r.error);if(r.ok)R.team()}
    else if(b.dataset.rm){if(!confirm('Remove this person from the team? They can no longer sign in.'))return;const r=await db.rpc('admin_remove_member',{p_user:b.dataset.rm});toast(r.ok?'Removed from the team':r.error);if(r.ok)R.team()}};
};
function reqDot(list){const d=$('#reqdot');if(d){d.textContent=list.length;d.classList.toggle('hide',!list.length)}}
/* ---------- recently deleted ---------- */
R.bin=async()=>{
  const [p,l,o]=await Promise.all([db.get('products','select=id,name,photo,deleted_at&deleted_at=not.is.null&order=deleted_at.desc'),db.get('lookbook','select=id,alt,photo,deleted_at&deleted_at=not.is.null&order=deleted_at.desc'),db.get('orders','select=id,order_no,customer_name,total,deleted_at&deleted_at=not.is.null&order=deleted_at.desc')]);
  if(!p.ok)return fail(p.error);
  const left=d=>Math.max(0,30-Math.floor((Date.now()-new Date(d))/864e5));
  const row=(t,id,img,title,meta,d)=>`<div class="item">${img?`<img src="${esc(pic(img,1))}" alt="">`:'<div class="thumb"></div>'}<div><h4>${esc(title)}</h4><div class="meta">${meta} · deleted ${when(d)} · erased in ${left(d)} day${left(d)===1?'':'s'}</div></div><div class="acts"><button class="btn small" data-t="${t}" data-id="${id}">Restore</button></div></div>`;
  const all=[...p.data.map(x=>row('products',x.id,x.photo,x.name,'Product',x.deleted_at)),...(l.data||[]).map(x=>row('lookbook',x.id,x.photo,x.alt||'Photo','More looks photo',x.deleted_at)),...(o.data||[]).map(x=>row('orders',x.id,null,x.order_no+' · '+x.customer_name,'Order · '+naira(x.total),x.deleted_at))];
  main(`<h2>Recently deleted</h2><p class="sub">Deleted products, photos and orders stay here for 30 days, then they are erased for good.</p><div class="list">${all.join('')||'<div class="empty">Nothing deleted in the last 30 days.</div>'}</div>`);
  $('#main').onclick=async e=>{const b=e.target.closest('[data-t]');if(!b)return;const r=await db.set(b.dataset.t,b.dataset.id,{deleted_at:null,updated_at:new Date().toISOString()});toast(r.ok?'Restored':r.error);if(r.ok)R.bin()};
};

/* ---------- account ---------- */
R.account=()=>{
  main(`<h2>Account</h2><p class="sub">Signed in as ${esc(ME.email)} (${ME.role==='owner'?'owner':'editor'}). You sign in with a code sent to this email, so there's no password to remember.</p><div class="grid">
   <form class="card grid" id="fn"><label class="f">Your name<input type="text" id="an" maxlength="80" value="${esc(ME.name)}"></label><div><button class="btn small">Save name</button></div></form>
   <div class="card"><button class="btn ghost" id="so">Sign out</button></div></div>`);
  $('#fn').onsubmit=async e=>{e.preventDefault();const n=$('#an').value.trim();const r=await db.set('admin_users',ME.user_id,{name:n},'user_id');if(r.ok){ME.name=n;toast('Name saved')}else toast(r.error)};
  $('#so').onclick=signOut;
};

boot();
})();
</script>
